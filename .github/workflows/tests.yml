name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, mbstring, curl, zip
          coverage: none

      - run: composer install --no-interaction --no-progress

      # composer test, in steps: PHPStan, then PHPUnit with a JUnit report.
      - run: composer analyse

      - id: phpunit
        run: vendor/bin/phpunit --log-junit junit.xml

      # Each failed test becomes an annotation in the run's summary, with its message.
      - if: failure() && steps.phpunit.outcome == 'failure'
        run: php .github/report-test-failures.php junit.xml
